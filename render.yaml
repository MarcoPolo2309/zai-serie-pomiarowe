# Blueprint Render.com – jedna usługa WWW (Docker) i darmowa baza PostgreSQL, oba w planie Free.
# Uwaga: darmowa baza Render wygasa po 30 dniach od utworzenia.
services:
  - type: web
    name: zai-serie-pomiarowe
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zai-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: zai-db
    plan: free
    region: frankfurt
    databaseName: zai
    user: zai
