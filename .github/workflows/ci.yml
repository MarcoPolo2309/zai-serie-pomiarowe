name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zai
          POSTGRES_PASSWORD: zai
          POSTGRES_DB: zai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zai -d zai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zai:zai@localhost:5432/zai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
